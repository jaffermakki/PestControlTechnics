<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCT Enterprise CRM – Real‑time Cloud Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  window.firebaseReady = { initializeApp, getFirestore, doc, setDoc, getDoc, onSnapshot };
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--primary:#4f46e5;--phover:#4338ca;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--border:#e2e8f0;--sidebar:#0f172a;}
.dark{--bg:#020617;--surface:#0f172a;--text:#f8fafc;--muted:#94a3b8;--primary:#6366f1;--phover:#818cf8;--danger:#f87171;--success:#34d399;--warning:#fbbf24;--border:#1e293b;--sidebar:#020617;}
body{background:var(--bg);color:var(--text);transition:.3s;}
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:260px;background:var(--sidebar);color:#f8fafc;padding:1.5rem;display:flex;flex-direction:column;transition:.3s;overflow-y:auto;}
#sidebar.collapsed{margin-left:-260px;}
#sidebar h2{font-size:1rem;margin-bottom:1.4rem;padding-bottom:.9rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px;}
.nsec{font-size:.6rem;letter-spacing:.1em;color:#475569;text-transform:uppercase;padding:.45rem 1rem .18rem;}
.ni{padding:.68rem 1rem;margin-bottom:.2rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:.65rem;font-weight:500;font-size:.84rem;color:#cbd5e1;}
.ni:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(3px);}
.ni.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.4);}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
header{background:rgba(255,255,255,.9);padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);}
.dark header{background:rgba(15,23,42,.9);}
.ha{display:flex;gap:.55rem;align-items:center;}
#ca{padding:1.4rem;overflow-y:auto;flex:1;}
.card{background:var(--surface);border-radius:12px;padding:1.4rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border:1px solid var(--border);}
button{background:var(--primary);color:#fff;border:none;padding:.52rem 1rem;border-radius:8px;cursor:pointer;font-weight:500;font-size:.84rem;display:inline-flex;align-items:center;gap:.38rem;}
button.sec{background:transparent;border:1px solid var(--border);color:var(--text);}
button.danger{background:var(--danger);}
button.sm{padding:.26rem .6rem;font-size:.74rem;}
input,select,textarea{width:100%;padding:.65rem .95rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:.85rem;font-size:.86rem;}
label{display:block;margin-bottom:.32rem;font-size:.74rem;font-weight:600;color:var(--muted);}
.hidden{display:none!important;}
.fb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.55rem;}
.mb3{margin-bottom:.9rem;}
.mb4{margin-bottom:1.4rem;}
.g{display:grid;gap:1.1rem;}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));}
.kc{display:flex;flex-direction:column;gap:.3rem;position:relative;overflow:hidden;padding:1rem;}
.kc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary);}
.kt{font-size:.7rem;color:var(--muted);font-weight:600;}
.kv{font-size:1.75rem;font-weight:700;}
.ks{font-size:.74rem;color:var(--muted);}
.tc{overflow-x:auto;border-radius:8px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}
th,td{padding:.78rem .95rem;border-bottom:1px solid var(--border);font-size:.84rem;}
th{background:var(--bg);font-weight:600;color:var(--muted);}
.badge{padding:.17rem .58rem;border-radius:999px;font-size:.67rem;font-weight:700;}
.badge.ok{background:rgba(16,185,129,.12);color:var(--success);}
.badge.warn{background:rgba(245,158,11,.12);color:var(--warning);}
.badge.info{background:rgba(79,70,229,.12);color:var(--primary);}
.badge.bad{background:rgba(239,68,68,.12);color:var(--danger);}
#mo{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:50;}
#mdl{background:var(--surface);padding:1.9rem;border-radius:12px;width:90%;max-width:640px;max-height:90vh;overflow-y:auto;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem;padding-bottom:.9rem;border-bottom:1px solid var(--border);}
#tc2{position:fixed;bottom:1.4rem;right:1.4rem;z-index:100;display:flex;flex-direction:column;gap:.45rem;}
.toast{background:var(--surface);color:var(--text);padding:.76rem 1.15rem;border-radius:8px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);border-left:4px solid var(--primary);display:flex;align-items:center;gap:9px;font-size:.82rem;}
.sw{position:relative;min-width:230px;}
.sw i{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;}
.sw input{margin:0;padding-left:2.3rem;}
.sr{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.95rem;}
</style>
</head>
<body>

<div id="lv" style="display:flex;justify-content:center;align-items:center;height:100vh;background:var(--bg);">
<div class="card" style="width:100%;max-width:420px;text-align:center;padding:2.8rem 2rem;">
  <div style="margin-bottom:1rem;"><i data-lucide="shield-check" style="width:50px;height:50px;color:var(--primary);"></i></div>
  <h2 style="margin-bottom:.4rem;">Welcome Back</h2>
  <p style="margin-bottom:1.8rem;color:var(--muted);">Pest Control Technics CRM</p>
  <form id="lf" onsubmit="return false;">
    <div><label>Username</label><input type="text" id="lu" required></div>
    <div><label>Password</label><input type="password" id="lp" required></div>
    <label style="display:flex;align-items:center;gap:.45rem;margin-bottom:.9rem;"><input type="checkbox" id="rm"> Stay logged in</label>
    <button type="button" id="loginBtn" style="width:100%;">Sign In</button>
  </form>
  <p style="margin-top:1.4rem;font-size:.68rem;">admin/admin123 | manager/manager123 | tech/tech123</p>
</div></div>

<div id="app-container" class="hidden">
<nav id="sidebar">
  <h2><i data-lucide="bug"></i> PCT CRM</h2>
  <div id="nm" style="flex:1;"></div>
  <div id="si2" style="margin-top:auto;padding-top:.9rem;border-top:1px solid rgba(255,255,255,.08);font-size:.7rem;">Ready</div>
</nav>
<main id="main">
  <header>
    <div class="ha">
      <button class="sec" id="toggleSidebarBtn" style="padding:.4rem;"><i data-lucide="menu"></i></button>
      <strong id="vt">Dashboard</strong>
    </div>
    <div class="ha">
      <div id="fb" style="cursor:pointer;display:flex;align-items:center;padding:.35rem .75rem;background:var(--bg);border:1px solid var(--border);border-radius:999px;gap:.35rem;font-size:.78rem;">
        <i data-lucide="phone-call" style="width:13px;"></i><span id="fc">Follow-ups</span>
      </div>
      <div style="display:flex;align-items:center;gap:.42rem;background:var(--bg);padding:.35rem .85rem;border-radius:999px;">
        <i data-lucide="user" style="width:13px;"></i><span id="ui"></span>
      </div>
      <button class="sec" id="themeToggleBtn" style="padding:.4rem;"><i data-lucide="moon"></i></button>
      <button class="danger" id="logoutBtn" style="padding:.4rem;"><i data-lucide="log-out"></i></button>
    </div>
  </header>
  <div id="ca"></div>
</main>
</div>

<div id="mo" onclick="if(event.target===this)window.app.closeModal()">
<div id="mdl">
  <div class="mh"><h3 id="mt"></h3><button class="sec" id="closeModalBtn">✕</button></div>
  <div id="mb"></div>
</div></div>
<div id="tc2"></div>

<script>
// ===================== UTILITIES =====================
const Utils = {
  toast(msg, type='success') {
    const c = document.getElementById('tc2');
    const t = document.createElement('div'); t.className = 'toast';
    const icon = type === 'success' ? 'check-circle' : (type === 'danger' ? 'alert-circle' : 'info');
    t.innerHTML = `<i data-lucide="${icon}"></i> ${msg}`;
    c.appendChild(t); if(window.lucide) lucide.createIcons();
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
  },
  currency(n) { return '₹' + parseFloat(n||0).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,'); },
  daysUntil(ds) { if(!ds) return null; return Math.ceil((new Date(ds) - new Date()) / 86400000); },
  badge(text, type) { return `<span class="badge ${type}">${text}</span>`; },
  table(data, cols, actions, emptyMsg = 'No records found.') {
    if(!data || !data.length) return `<div style="padding:2rem;text-align:center;color:var(--muted);"><i data-lucide="inbox" style="width:36px;opacity:.3;"></i><p>${emptyMsg}</p></div>`;
    let h = `<div class="tc"><table><thead><tr>`;
    cols.forEach(c => h += `<th>${c.label}</th>`);
    if(actions) h += `<th>Actions</th>`;
    h += `</tr></thead><tbody>`;
    data.forEach(row => {
      h += `<tr>`;
      cols.forEach(c => {
        let val = row[c.key] || '—';
        if(c.format) val = c.format(val, row);
        h += `<td>${val}</td>`;
      });
      if(actions) h += `<td><div style="display:flex;gap:4px;flex-wrap:wrap;">${actions(row)}</div></td>`;
      h += `</tr>`;
    });
    h += `</tbody></table></div>`;
    return h;
  },
  numberToWords(num) {
    const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
    const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    if ((num = num.toString()).length > 9) return 'overflow';
    let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
    if (!n) return ''; let s = '';
    s += (n[1] != 0) ? (a[+n[1]] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
    s += (n[2] != 0) ? (a[+n[2]] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
    s += (n[3] != 0) ? (a[+n[3]] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
    s += (n[4] != 0) ? (a[+n[4]] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
    s += (n[5] != 0) ? ((s != '') ? 'and ' : '') + (a[+n[5]] || b[n[5][0]] + ' ' + a[n[5][1]]) + 'Only' : 'Only';
    return s;
  }
};

// ===================== STORE WITH CLOUD SYNC =====================
class Store {
  constructor() {
    this.defaultData = {
      users: [
        {id:'u1', username:'admin', pass:'admin123', role:'admin'},
        {id:'u2', username:'manager', pass:'manager123', role:'manager'},
        {id:'u3', username:'tech', pass:'tech123', role:'technician'}
      ],
      customers: [{id:'c1', name:'Acme Corp', phone:'9876543210', email:'contact@acme.com', address:'Hi-Tech City, Hyderabad', area:'Hi-Tech City', followupDate:'', followupNote:''}],
      invoices: [], jobs: [], amc: [], inventory: [], logs: [],
      settings: { theme:'light', companyName:'PEST CONTROL TECHNICS', companyAddress:'3-4-607, 1st Floor, NARAYANGUDA, Hyderabad-29', companyPhone:'', companyGST:'', companyTagline:'Creating a Pest free environment since 1989', companyEmail:'info@pesttech.in', companyLogo: null, memberLogo: null }
    };
    const raw = localStorage.getItem('pct_cloud_v1');
    if(raw) try { this.db = JSON.parse(raw); } catch(e){ this.db = this.defaultData; }
    else this.db = this.defaultData;
    if(!this.db.users) this.db.users = this.defaultData.users;
    if(!this.db.customers) this.db.customers = this.defaultData.customers;
    if(!this.db.settings) this.db.settings = this.defaultData.settings;
    if(!this.db.settings.hasOwnProperty('memberLogo')) this.db.settings.memberLogo = null;
    this.save();
    this.services = ['Cockroach Treatment','Termite Treatment','Rodent Control','Mosquito Fogging','Bed Bug Treatment','Sanitization','General Pest Control','Wood Borer Treatment'];
    this.areas = ['Secunderabad','Banjara Hills','Jubilee Hills','Hi-Tech City','Kukatpally','Ameerpet','Begumpet','Madhapur','Gachibowli'];
    this.contractTypes = ['General Pest','Termite','Rodent','Mosquito Fogging','Bed Bug','Pre-Construction Termite','Post-Construction Termite'];
    this.unsubscribe = null;
    this.userId = null;
  }

  save() {
    localStorage.setItem('pct_cloud_v1', JSON.stringify(this.db));
    this.updateSaveIndicator();
    if(this.userId && window.firebaseReady) this.pushToFirebase().catch(e=>console.warn(e));
  }

  async pushToFirebase() {
    if(!this.userId) return;
    const { doc, setDoc } = window.firebaseReady;
    await setDoc(doc(window.firestoreInstance, "companies", this.userId), { data: this.db, lastUpdate: new Date().toISOString() });
  }

  updateSaveIndicator() {
    const el = document.getElementById('si2');
    if(el) { const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); el.innerHTML = `<i data-lucide="check-circle" style="width:10px;"></i> Saved ${t}`; if(window.lucide) lucide.createIcons(); }
  }

  get(table) { return this.db[table] || []; }
  byId(table, id) { return this.get(table).find(x => x.id === id); }

  add(table, item) {
    if(!this.db[table]) this.db[table] = [];
    item.id = Date.now().toString(36) + Math.random().toString(36).substr(2,5);
    item.createdAt = new Date().toISOString();
    this.db[table].push(item);
    this.save();
    return item;
  }

  update(table, id, data) {
    const idx = this.db[table].findIndex(x => x.id === id);
    if(idx !== -1) { this.db[table][idx] = { ...this.db[table][idx], ...data, updatedAt: new Date().toISOString() }; this.save(); }
  }

  delete(table, id) { this.db[table] = this.db[table].filter(x => x.id !== id); this.save(); }

  addLog(action) {
    if(!this.db.logs) this.db.logs = [];
    const user = window.app?.me?.username || 'System';
    this.db.logs.unshift({ id: Date.now(), user, action, time: new Date().toLocaleString() });
    if(this.db.logs.length > 300) this.db.logs.pop();
    this.save();
  }

  async enableRealTimeSync(userId) {
    this.userId = userId;
    if(!window.firebaseReady) return;
    const { doc, onSnapshot } = window.firebaseReady;
    const docRef = doc(window.firestoreInstance, "companies", userId);
    if(this.unsubscribe) this.unsubscribe();
    this.unsubscribe = onSnapshot(docRef, (snap) => {
      if(snap.exists()) {
        const cloudData = snap.data().data;
        if(JSON.stringify(this.db) !== JSON.stringify(cloudData)) {
          this.db = cloudData;
          this.save();
          if(window.app && window.app.currentView) window.app.refreshCurrentView();
          Utils.toast("Cloud update received", "info");
        }
      } else {
        this.pushToFirebase();
      }
    });
  }

  stopSync() { if(this.unsubscribe) this.unsubscribe(); this.userId = null; }
}

// ===================== APP (ALL MODULES) =====================
class App {
  constructor() {
    this.store = new Store();
    this.me = null;
    this.charts = {};
    this.currentView = 'dashboard';
    this.initEventListeners();
    this.autoLogin();
  }

  initEventListeners() {
    document.getElementById('loginBtn').addEventListener('click', () => this.login());
    document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
    document.getElementById('toggleSidebarBtn').addEventListener('click', () => this.toggleSidebar());
    document.getElementById('themeToggleBtn').addEventListener('click', () => this.toggleTheme());
    document.getElementById('closeModalBtn').addEventListener('click', () => this.closeModal());
    document.getElementById('fb').addEventListener('click', () => this.loadView('followups'));
    document.getElementById('nm').addEventListener('click', (e) => {
      const item = e.target.closest('.ni');
      if(item && item.dataset.view) this.loadView(item.dataset.view);
    });
  }

  autoLogin() {
    try {
      const raw = sessionStorage.getItem('pct_s') || localStorage.getItem('pct_r');
      if(raw) {
        const sess = JSON.parse(raw);
        const user = this.store.get('users').find(u => u.id === sess.id && u.username === sess.username);
        if(user) { this.doLogin(user, !!localStorage.getItem('pct_r')); return true; }
      }
    } catch(e) {}
    document.getElementById('lv').style.display = 'flex';
    lucide.createIcons();
    return false;
  }

  login() {
    const username = document.getElementById('lu').value.trim();
    const password = document.getElementById('lp').value;
    const remember = document.getElementById('rm').checked;
    const user = this.store.get('users').find(u => u.username === username && u.pass === password);
    if(user) { this.doLogin(user, remember); Utils.toast(`Welcome, ${user.username}!`); }
    else Utils.toast('Invalid credentials', 'danger');
  }

  async doLogin(user, remember) {
    this.me = user;
    const sessData = JSON.stringify({ id: user.id, username: user.username });
    sessionStorage.setItem('pct_s', sessData);
    if(remember) localStorage.setItem('pct_r', sessData);
    else localStorage.removeItem('pct_r');
    document.getElementById('lv').style.display = 'none';
    document.getElementById('app-container').classList.remove('hidden');
    document.getElementById('ui').innerText = `${user.username} · ${user.role}`;
    if(window.firebaseReady && window.firestoreInstance) await this.store.enableRealTimeSync(user.id);
    this.buildMenu();
    this.loadView('dashboard');
    this.updateFollowupBell();
    if(this.store.db.settings.theme === 'dark') document.body.classList.add('dark');
  }

  logout() {
    if(this.store) this.store.stopSync();
    this.me = null;
    sessionStorage.removeItem('pct_s');
    localStorage.removeItem('pct_r');
    document.getElementById('lv').style.display = 'flex';
    document.getElementById('app-container').classList.add('hidden');
    document.getElementById('lf').reset();
    Object.values(this.charts).forEach(c => c && c.destroy());
    this.charts = {};
  }

  refreshCurrentView() { if(this.currentView) this.loadView(this.currentView); }

  toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

  toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    this.store.db.settings.theme = isDark ? 'dark' : 'light';
    this.store.save();
    if(this.currentView === 'dashboard') this.renderDashboard();
  }

  buildMenu() {
    const views = {
      dashboard: { title:'Dashboard', icon:'layout-dashboard', roles:['admin','manager','technician'] },
      customers: { title:'Customers', icon:'users', roles:['admin','manager','technician'] },
      followups: { title:'Follow-Ups', icon:'phone-call', roles:['admin','manager'] },
      jobs: { title:'Jobs & Scheduling', icon:'calendar-days', roles:['admin','manager','technician'] },
      invoices: { title:'Invoices & Billing', icon:'file-text', roles:['admin','manager'] },
      amc: { title:'AMC Contracts', icon:'refresh-cw', roles:['admin','manager'] },
      inventory: { title:'Inventory & Chemicals', icon:'package', roles:['admin','manager'] },
      reports: { title:'Reports', icon:'bar-chart-3', roles:['admin','manager'] },
      settings: { title:'Settings & Users', icon:'settings', roles:['admin'] }
    };
    const container = document.getElementById('nm');
    container.innerHTML = '';
    let lastSection = '';
    for(const [key,val] of Object.entries(views)) {
      if(!val.roles.includes(this.me.role)) continue;
      const section = (key === 'reports' || key === 'settings') ? 'Reports' : 'Main';
      if(section !== lastSection) {
        lastSection = section;
        const secDiv = document.createElement('div'); secDiv.className = 'nsec'; secDiv.innerText = section;
        container.appendChild(secDiv);
      }
      const div = document.createElement('div'); div.className = 'ni'; div.dataset.view = key;
      div.innerHTML = `<i data-lucide="${val.icon}" style="width:15px;"></i><span>${val.title}</span>`;
      container.appendChild(div);
    }
    lucide.createIcons();
  }

  loadView(view) {
    if(!this.me) return;
    const methodName = 'render' + view.charAt(0).toUpperCase() + view.slice(1);
    if(typeof this[methodName] !== 'function') view = 'dashboard';
    this.currentView = view;
    document.getElementById('vt').innerText = view.charAt(0).toUpperCase() + view.slice(1);
    document.querySelectorAll('.ni').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    document.getElementById('ca').innerHTML = '';
    Object.values(this.charts).forEach(c => c && c.destroy());
    this.charts = {};
    this[methodName]();
    lucide.createIcons();
    this.updateFollowupBell();
  }

  openModal(title, html) {
    document.getElementById('mt').innerText = title;
    document.getElementById('mb').innerHTML = html;
    document.getElementById('mo').style.display = 'flex';
    lucide.createIcons();
  }
  closeModal() { document.getElementById('mo').style.display = 'none'; }

  updateFollowupBell() {
    const today = new Date(); today.setHours(0,0,0,0);
    const due = this.store.get('customers').filter(c => {
      if(!c.followupDate) return false;
      const d = new Date(c.followupDate); d.setHours(0,0,0,0);
      return d <= today;
    }).length;
    const span = document.getElementById('fc');
    if(span) span.innerText = due > 0 ? `${due} due today` : 'Follow-ups';
  }

  // ----- DASHBOARD -----
  renderDashboard() {
    const area = document.getElementById('ca');
    const invs = this.store.get('invoices');
    const jobs = this.store.get('jobs');
    const amcs = this.store.get('amc');
    const custs = this.store.get('customers');
    const totalRev = invs.reduce((s,i)=>s+Number(i.total||0),0);
    const outstanding = invs.filter(i=>i.paymentStatus !== 'Paid').reduce((s,i)=>s+Number(i.total||0),0);
    const pendingJobs = jobs.filter(j=>j.status !== 'Completed').length;
    const expiringAmcs = amcs.filter(a=>{const d=Utils.daysUntil(a.endDate); return d!==null && d>=0 && d<=30;}).length;
    const months = [], revData = [];
    const now = new Date();
    for(let i=5;i>=0;i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push(d.toLocaleString('default',{month:'short'}));
      revData.push(invs.filter(inv=>{const id=new Date(inv.date); return id.getFullYear()===d.getFullYear() && id.getMonth()===d.getMonth();}).reduce((s,inv)=>s+Number(inv.total||0),0));
    }
    const thisM = revData[5]||0, lastM = revData[4]||0;
    const chg = lastM>0 ? ((thisM-lastM)/lastM*100).toFixed(0) : (thisM>0?100:0);
    const svcMap = {};
    invs.forEach(inv => (inv.lines||[]).forEach(l=>{ svcMap[l.service] = (svcMap[l.service]||0) + Number(l.amount||0); }));
    const topSvcs = Object.entries(svcMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const today = new Date(); today.setHours(0,0,0,0);
    const dueFollowups = custs.filter(c=>{ if(!c.followupDate) return false; const d=new Date(c.followupDate); d.setHours(0,0,0,0); return d<=today; });
    const recentLogs = this.store.get('logs').slice(0,5);
    area.innerHTML = `
      <div class="g g4 mb4">
        <div class="card kc"><div class="kt">Total Revenue</div><div class="kv">${Utils.currency(totalRev)}</div><div class="ks">This month: ${Utils.currency(thisM)} <span style="color:${chg>=0?'var(--success)':'var(--danger)'}">${chg>=0?'↑':'↓'}${Math.abs(chg)}%</span></div></div>
        <div class="card kc" style="--primary:var(--danger)"><div class="kt">Outstanding</div><div class="kv" style="color:var(--danger)">${Utils.currency(outstanding)}</div><div class="ks">${invs.filter(i=>i.paymentStatus==='Unpaid').length} unpaid</div></div>
        <div class="card kc" style="--primary:var(--warning)"><div class="kt">Pending Jobs</div><div class="kv">${pendingJobs}</div><div class="ks">${jobs.filter(j=>j.status==='Completed').length} completed</div></div>
        <div class="card kc" style="--primary:${expiringAmcs>0?'var(--warning)':'var(--success)'}"><div class="kt">AMC Contracts</div><div class="kv">${amcs.length}</div><div class="ks">${expiringAmcs>0 ? `⚠️ ${expiringAmcs} expiring soon` : 'All healthy'}</div></div>
      </div>
      ${dueFollowups.length ? `<div class="card mb4" style="border-left:4px solid var(--warning);background:rgba(245,158,11,.05);"><div class="fb"><strong>📞 ${dueFollowups.length} Follow-up(s) due today</strong><button class="sec sm" onclick="app.loadView('followups')">View All</button></div>${dueFollowups.slice(0,3).map(c=>`<div style="margin-top:0.5rem;"><strong>${c.name}</strong> - ${c.phone}${c.followupNote?`<br><small>${c.followupNote}</small>`:''}</div>`).join('')}</div>` : ''}
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:1.1rem;margin-bottom:1.1rem;">
        <div class="card" style="height:300px;"><h4>Monthly Revenue (6 months)</h4><canvas id="revChart"></canvas></div>
        <div class="card"><h4>Top Services</h4>${topSvcs.length ? `<canvas id="svcChart" style="height:150px;"></canvas>${topSvcs.map(([s,v])=>`<div class="sr"><span>${s}</span><strong>${Utils.currency(v)}</strong></div>`).join('')}` : '<p class="muted">No invoice data yet.</p>'}</div>
      </div>
      <div class="g g2"><div class="card"><h4>Recent Activity</h4>${recentLogs.map(l=>`<div style="padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.8rem;"><strong>${l.user}</strong> ${l.action}<span style="float:right;font-size:0.7rem;">${l.time}</span></div>`).join('')||'<p class="muted">No activity.</p>'}</div>
      <div class="card"><h4>Technician Performance</h4>${this.renderTechPerformance()}</div></div>
    `;
    setTimeout(() => {
      const rc = document.getElementById('revChart');
      if(rc) this.charts.rev = new Chart(rc, { type:'bar', data:{ labels:months, datasets:[{ label:'Revenue', data:revData, backgroundColor:'rgba(79,70,229,0.7)' }] }, options:{ responsive:true, maintainAspectRatio:true } });
      const sc = document.getElementById('svcChart');
      if(sc && topSvcs.length) this.charts.svc = new Chart(sc, { type:'doughnut', data:{ labels:topSvcs.map(s=>s[0]), datasets:[{ data:topSvcs.map(s=>s[1]), backgroundColor:['#4f46e5','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] } });
    }, 100);
  }

  renderTechPerformance() {
    const jobs = this.store.get('jobs');
    const techs = this.store.get('users').filter(u => u.role === 'technician');
    if(!techs.length) return '<p class="muted">No technicians.</p>';
    return techs.map(t => {
      const total = jobs.filter(j => j.techId === t.username).length;
      const done = jobs.filter(j => j.techId === t.username && j.status === 'Completed').length;
      const pct = total ? Math.round(done/total*100) : 0;
      const color = pct > 75 ? 'var(--success)' : (pct > 40 ? 'var(--warning)' : 'var(--danger)');
      return `<div><div class="fb"><span>${t.username}</span><span>${done}/${total} jobs</span></div><div style="height:5px;background:var(--border);border-radius:3px;"><div style="width:${pct}%;height:100%;background:${color};border-radius:3px;"></div></div></div>`;
    }).join('');
  }

  // ----- CUSTOMERS -----
  renderCustomers() {
    const data = this.store.get('customers');
    const today = new Date(); today.setHours(0,0,0,0);
    const cols = [
      { key:'name', label:'Name', format:(v,r)=>`<strong style="cursor:pointer;color:var(--primary);" onclick="app.viewCustomer('${r.id}')">${v}</strong>` },
      { key:'phone', label:'Phone' }, { key:'email', label:'Email' }, { key:'area', label:'Area' },
      { key:'followupDate', label:'Follow-Up', format:v => {
          if(!v) return '—';
          const d = new Date(v); d.setHours(0,0,0,0);
          const diff = Math.ceil((d-today)/86400000);
          if(diff<0) return Utils.badge(`Overdue ${-diff}d`, 'bad');
          if(diff===0) return Utils.badge('Today', 'warn');
          return Utils.badge(`In ${diff}d`, 'info');
        } }
    ];
    const actions = (row) => `
      <button class="sec sm" onclick="app.viewCustomer('${row.id}')">👁️</button>
      <button class="sec sm" onclick="app.showCustomerForm('${row.id}')">✏️</button>
      <button class="danger sm" onclick="app.deleteCustomer('${row.id}')">🗑️</button>
    `;
    document.getElementById('ca').innerHTML = `
      <div class="fb mb3"><div class="sw"><i data-lucide="search"></i><input type="text" id="searchCustomers" placeholder="Search..." oninput="app.filterTable('customers')"></div><button onclick="app.showCustomerForm()">+ Add Customer</button></div>
      <div class="card" style="padding:0;" id="customersTable">${Utils.table(data, cols, actions, 'No customers yet.')}</div>
    `;
  }

  showCustomerForm(id) {
    const c = id ? this.store.byId('customers', id) : {};
    const areaOptions = this.store.areas.map(a => `<option value="${a}" ${c.area===a ? 'selected' : ''}>${a}</option>`).join('');
    this.openModal(id ? 'Edit Customer' : 'Add Customer', `
      <form onsubmit="app.saveCustomer(event, '${id||''}')">
        <div class="fr"><div><label>Name *</label><input name="name" required value="${c.name||''}"></div><div><label>Phone *</label><input name="phone" required value="${c.phone||''}"></div></div>
        <div class="fr"><div><label>Email</label><input name="email" value="${c.email||''}"></div><div><label>Area</label><select name="area"><option value="">Select...</option>${areaOptions}</select></div></div>
        <label>Address</label><textarea name="address" rows="2">${c.address||''}</textarea>
        <div style="background:rgba(79,70,229,.05);border-radius:8px;padding:0.8rem;margin-bottom:1rem;"><strong>Follow-up Reminder</strong>
          <div class="fr"><div><label>Date</label><input type="date" name="followupDate" value="${c.followupDate||''}"></div><div><label>Note</label><input name="followupNote" value="${c.followupNote||''}"></div></div>
        </div>
        <button type="submit">Save Customer</button>
      </form>
    `);
  }

  saveCustomer(e, id) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    if(id) this.store.update('customers', id, data);
    else this.store.add('customers', data);
    this.closeModal();
    this.renderCustomers();
    Utils.toast(id ? 'Customer updated' : 'Customer added');
    this.updateFollowupBell();
  }

  deleteCustomer(id) {
    if(confirm('Delete this customer?')) {
      this.store.delete('customers', id);
      this.renderCustomers();
      Utils.toast('Customer deleted');
    }
  }

  viewCustomer(id) {
    const c = this.store.byId('customers', id);
    if(!c) return;
    const invs = this.store.get('invoices').filter(i => i.customerId === id);
    const jobs = this.store.get('jobs').filter(j => j.customerId === id);
    const amcs = this.store.get('amc').filter(a => a.customerId === id);
    const spent = invs.reduce((s,i)=>s+Number(i.total||0),0);
    const owed = invs.filter(i=>i.paymentStatus!=='Paid').reduce((s,i)=>s+Number(i.total||0),0);
    this.openModal(`Customer: ${c.name}`, `
      <div style="display:flex;gap:1rem;margin-bottom:1rem;"><div style="width:50px;height:50px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">${c.name.charAt(0)}</div><div><p><strong>${c.name}</strong><br>${c.phone}<br>${c.email||'—'}<br>${c.address||'—'}</p></div></div>
      <div class="g g3" style="margin-bottom:1rem;"><div class="card"><div class="kv">${Utils.currency(spent)}</div><div>Total Spent</div></div><div class="card"><div class="kv" style="color:var(--danger)">${Utils.currency(owed)}</div><div>Outstanding</div></div><div class="card"><div class="kv">${jobs.length}</div><div>Jobs</div></div></div>
      <div class="tabs" style="display:flex;gap:0.5rem;border-bottom:2px solid var(--border);margin-bottom:1rem;"><div class="tab active" onclick="app.switchCustomerTab('invoices')">Invoices (${invs.length})</div><div class="tab" onclick="app.switchCustomerTab('jobs')">Jobs (${jobs.length})</div><div class="tab" onclick="app.switchCustomerTab('amc')">AMC (${amcs.length})</div></div>
      <div id="customerTabContent">${Utils.table(invs, [{key:'invNum',label:'#'},{key:'date',label:'Date'},{key:'total',label:'Amount',format:v=>Utils.currency(v)},{key:'paymentStatus',label:'Status',format:v=>Utils.badge(v||'Unpaid', v==='Paid'?'ok':'warn')}], null)}</div>
    `);
    this.customerTabData = { invs, jobs, amcs };
  }

  switchCustomerTab(tab) {
    const data = this.customerTabData;
    let html = '';
    if(tab === 'invoices') html = Utils.table(data.invs, [{key:'invNum',label:'#'},{key:'date',label:'Date'},{key:'total',label:'Amount',format:v=>Utils.currency(v)},{key:'paymentStatus',label:'Status',format:v=>Utils.badge(v||'Unpaid', v==='Paid'?'ok':'warn')}], null);
    else if(tab === 'jobs') html = Utils.table(data.jobs, [{key:'date',label:'Date'},{key:'service',label:'Service'},{key:'status',label:'Status',format:v=>Utils.badge(v, v==='Completed'?'ok':'warn')}], null);
    else html = Utils.table(data.amcs, [{key:'contractType',label:'Type'},{key:'startDate',label:'Start'},{key:'endDate',label:'End'}], null);
    document.getElementById('customerTabContent').innerHTML = html;
    lucide.createIcons();
    document.querySelectorAll('.tab').forEach((el,i)=> el.classList.toggle('active', (i===0 && tab==='invoices')||(i===1 && tab==='jobs')||(i===2 && tab==='amc')));
  }

  filterTable(table) {
    const searchId = `search${table.charAt(0).toUpperCase()+table.slice(1)}`;
    const q = document.getElementById(searchId)?.value.toLowerCase() || '';
    const rows = document.querySelectorAll(`#${table}Table tbody tr`);
    rows.forEach(tr => tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none');
  }

  // ----- FOLLOW-UPS -----
  renderFollowups() {
    const custs = this.store.get('customers').filter(c => c.followupDate).sort((a,b)=>new Date(a.followupDate)-new Date(b.followupDate));
    const today = new Date(); today.setHours(0,0,0,0);
    const overdue = custs.filter(c => { const d=new Date(c.followupDate); d.setHours(0,0,0,0); return d<today; });
    const dueToday = custs.filter(c => { const d=new Date(c.followupDate); d.setHours(0,0,0,0); return d.getTime()===today.getTime(); });
    const upcoming = custs.filter(c => { const d=new Date(c.followupDate); d.setHours(0,0,0,0); return d>today; });
    const renderGroup = (title, list, color) => {
      if(!list.length) return '';
      return `<h4 style="margin:1rem 0 0.5rem;color:${color};">${title} (${list.length})</h4>${list.map(c=>`<div class="card" style="margin-bottom:0.5rem;"><div class="fb"><div><strong>${c.name}</strong> · ${c.phone}<br>${c.followupNote ? `<small>${c.followupNote}</small>` : ''}<br><small>📅 ${new Date(c.followupDate).toLocaleDateString()}</small></div><div><button class="sm success" onclick="app.markFollowupDone('${c.id}')">✓ Done</button><button class="sm sec" onclick="app.rescheduleFollowup('${c.id}')">📅 Reschedule</button></div></div></div>`).join('')}`;
    };
    document.getElementById('ca').innerHTML = `<div class="card"><h3>📞 Follow-up Manager</h3>${renderGroup('🔴 Overdue', overdue, 'var(--danger)')}${renderGroup('🟡 Due Today', dueToday, 'var(--warning)')}${renderGroup('🔵 Upcoming', upcoming, 'var(--primary)')}${!custs.length ? '<p class="muted">No follow-ups scheduled.</p>' : ''}</div>`;
  }

  markFollowupDone(id) {
    this.store.update('customers', id, { followupDate: '', followupNote: '' });
    this.updateFollowupBell();
    if(this.currentView === 'followups') this.renderFollowups();
    else if(this.currentView === 'dashboard') this.renderDashboard();
    Utils.toast('Follow-up marked as done');
  }

  rescheduleFollowup(id) {
    const c = this.store.byId('customers', id);
    this.openModal('Reschedule Follow-up', `
      <form onsubmit="app.saveReschedule(event, '${id}')">
        <label>New Date</label><input type="date" name="followupDate" required>
        <label>Note</label><input name="followupNote" value="${c.followupNote||''}">
        <button type="submit">Save</button>
      </form>
    `);
  }

  saveReschedule(e, id) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    this.store.update('customers', id, data);
    this.closeModal();
    this.renderFollowups();
    this.updateFollowupBell();
    Utils.toast('Rescheduled');
  }

  // ----- JOBS -----
  renderJobs() {
    const jobs = this.store.get('jobs');
    const custs = this.store.get('customers');
    const cols = [
      { key:'date', label:'Date', format:v=>`<strong>${v}</strong>` },
      { key:'customerId', label:'Customer', format:v=>custs.find(c=>c.id===v)?.name || 'Unknown' },
      { key:'service', label:'Service' }, { key:'techId', label:'Technician' }, { key:'status', label:'Status', format:v=>Utils.badge(v, v==='Completed'?'ok':v==='Pending'?'warn':'info') }
    ];
    const actions = (row) => `
      <button class="sec sm" onclick="app.advanceJobStatus('${row.id}')">⏩</button>
      <button class="sec sm" onclick="app.showJobLogForm('${row.id}')">📋</button>
      <button class="danger sm" onclick="app.deleteJob('${row.id}')">🗑️</button>
    `;
    document.getElementById('ca').innerHTML = `
      <div class="fb mb3"><div class="sw"><i data-lucide="search"></i><input type="text" id="searchJobs" placeholder="Search..." oninput="app.filterTable('jobs')"></div><button onclick="app.showJobForm()">+ Assign Job</button></div>
      <div class="card" style="padding:0;" id="jobsTable">${Utils.table(jobs, cols, actions, 'No jobs yet.')}</div>
    `;
  }

  showJobForm() {
    const custs = this.store.get('customers');
    const techs = this.store.get('users').filter(u => u.role === 'technician');
    this.openModal('Assign New Job', `
      <form onsubmit="app.saveJob(event)">
        <label>Customer *</label><select name="customerId" required>${custs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
        <div class="fr"><div><label>Service *</label><select name="service" required>${this.store.services.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Area</label><input name="area"></div></div>
        <div class="fr"><div><label>Technician</label><select name="techId">${techs.map(t=>`<option>${t.username}</option>`).join('')}</select></div><div><label>Date *</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div></div>
        <label>Notes</label><textarea name="notes" rows="2"></textarea>
        <button type="submit">Assign Job</button>
      </form>
    `);
  }

  saveJob(e) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    data.status = 'Pending';
    this.store.add('jobs', data);
    this.closeModal();
    this.renderJobs();
    Utils.toast('Job assigned');
  }

  advanceJobStatus(id) {
    const job = this.store.byId('jobs', id);
    const statuses = ['Pending','Assigned','In Progress','Completed'];
    const next = statuses[Math.min(statuses.indexOf(job.status)+1, 3)];
    this.store.update('jobs', id, { status: next });
    this.renderJobs();
    Utils.toast(`Status → ${next}`);
  }

  showJobLogForm(id) {
    const job = this.store.byId('jobs', id);
    this.openModal('Job Log Details', `
      <form onsubmit="app.saveJobLog(event, '${id}')">
        <div class="fr"><div><label>Chemical Used</label><input name="chemicalUsed" value="${job.chemicalUsed||''}"></div><div><label>Qty</label><input name="chemicalQty" value="${job.chemicalQty||''}"></div></div>
        <label>Completion Notes</label><textarea name="completionNotes" rows="3">${job.completionNotes||''}</textarea>
        <label>Next Service Date</label><input type="date" name="nextServiceDate" value="${job.nextServiceDate||''}">
        <div class="fr"><button type="submit" class="sec">Save Notes</button><button type="button" class="success" onclick="app.saveJobLog(event, '${id}', true)">Save & Complete</button></div>
      </form>
    `);
  }

  saveJobLog(e, id, complete = false) {
    e.preventDefault();
    const form = e.target.closest('form');
    const data = Object.fromEntries(new FormData(form));
    if(complete) data.status = 'Completed';
    this.store.update('jobs', id, data);
    this.closeModal();
    this.renderJobs();
    Utils.toast(complete ? 'Job completed!' : 'Notes saved');
  }

  deleteJob(id) {
    if(confirm('Delete this job?')) { this.store.delete('jobs', id); this.renderJobs(); Utils.toast('Job deleted'); }
  }

  // ----- INVOICES -----
  renderInvoices() {
    const invs = this.store.get('invoices');
    const custs = this.store.get('customers');
    const cols = [
      { key:'invNum', label:'Invoice #' }, { key:'date', label:'Date' },
      { key:'customerId', label:'Customer', format:v=>custs.find(c=>c.id===v)?.name || 'Unknown' },
      { key:'total', label:'Amount', format:v=>Utils.currency(v) },
      { key:'paymentStatus', label:'Status', format:v=>Utils.badge(v||'Unpaid', v==='Paid'?'ok':'warn') }
    ];
    const actions = (row) => `
      <button class="sec sm" onclick="app.printInvoice('${row.id}')">🖨️</button>
      <button class="sec sm" onclick="app.emailInvoice('${row.id}')">📧</button>

      <div class="fb mb3"><div class="sw"><i data-lucide="search"></i><input type="text" id="searchInvoices" placeholder="Search..." oninput="app.filterTable('invoices')"></div><button onclick="app.showInvoiceForm()">+ Create Invoice</button></div>
      <div class="card" style="padding:0;" id="invoicesTable">${Utils.table(invs, cols, actions, 'No invoices yet.')}</div>
    `;
  }

  showInvoiceForm() {
    const custs = this.store.get('customers');
    const invNum = `INV-${new Date().getFullYear()}-${Date.now().toString().slice(-5)}`;
    this.openModal('Create Invoice', `
      <form onsubmit="app.saveInvoice(event)">
        <div class="fr"><div><label>Invoice #</label><input name="invNum" value="${invNum}" readonly></div><div><label>Date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div></div>
        <div class="fr"><div><label>Work Order No.</label><input name="workOrderNo" placeholder="Optional"></div><div><label>Description / Month</label><input name="serviceDescription" placeholder="e.g., General pest control for May 2026"></div></div>
        <label>Customer</label><select name="customerId" required><option value="">Select...</option>${custs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
        <h4>Line Items</h4>
        <table id="invLines" style="width:100%;margin-bottom:0.5rem;"><thead><tr><th>Service</th><th>Amount (₹)</th><th></th></table></thead><tbody><tr><td><select name="service_0" class="invService">${this.store.services.map(s=>`<option>${s}</option>`).join('')}</select></td><td><input type="number" class="invAmount" onchange="app.calcInvoiceTotal()" min="0" step="1"></td><td><button type="button" class="danger sm" onclick="this.closest('tr').remove();app.calcInvoiceTotal()">✕</button></td></tr></tbody></table>
        <button type="button" class="sec sm" onclick="app.addInvoiceLine()">+ Add Line</button>
        <div class="g g3" style="margin-top:0.8rem;"><div><label>Subtotal</label><input id="invSub" readonly></div><div><label>GST 18%</label><input id="invGst" readonly></div><div><label>Total</label><input name="total" id="invTotal" readonly></div></div>
        <label>Payment Status</label><select name="paymentStatus"><option>Unpaid</option><option>Partial</option><option>Paid</option></select>
        <button type="submit">Generate Invoice</button>
      </form>
    `);
  }

  addInvoiceLine() {
    const tbody = document.querySelector('#invLines tbody');
    const row = document.createElement('tr');
    row.innerHTML = `<tr><select class="invService" style="margin:0;">${this.store.services.map(s=>`<option>${s}</option>`).join('')}</select></td><td><input type="number" class="invAmount" onchange="app.calcInvoiceTotal()" min="0"></td><td><button type="button" class="danger sm" onclick="this.closest('tr').remove();app.calcInvoiceTotal()">✕</button></td>`;
    tbody.appendChild(row);
  }

  calcInvoiceTotal() {
    const amounts = Array.from(document.querySelectorAll('.invAmount')).map(inp => Number(inp.value) || 0);
    const sub = amounts.reduce((a,b)=>a+b,0);
    const gst = sub * 0;
    const tot = sub + gst;
    document.getElementById('invSub').value = sub.toFixed(2);
    document.getElementById('invGst').value = gst.toFixed(2);
    document.getElementById('invTotal').value = tot.toFixed(2);
  }

  saveInvoice(e) {
    e.preventDefault();
    const form = e.target;
    const invNum = form.invNum.value;
    const date = form.date.value;
    const workOrderNo = form.workOrderNo?.value || '';
    const serviceDescription = form.serviceDescription?.value || '';
    const customerId = form.customerId.value;
    const paymentStatus = form.paymentStatus.value;
    const total = parseFloat(document.getElementById('invTotal').value);
    const services = Array.from(document.querySelectorAll('.invService')).map(s => s.value);
    const amounts = Array.from(document.querySelectorAll('.invAmount')).map(a => Number(a.value) || 0);
    const lines = services.map((s,i) => ({ service: s, amount: amounts[i] }));
    this.store.add('invoices', { invNum, date, workOrderNo, serviceDescription, customerId, total, paymentStatus, lines });
    this.closeModal();
    this.renderInvoices();
    Utils.toast('Invoice created');
  }

  togglePaymentStatus(id) {
    const inv = this.store.byId('invoices', id);
    const newStatus = inv.paymentStatus === 'Paid' ? 'Unpaid' : 'Paid';
    this.store.update('invoices', id, { paymentStatus: newStatus });
    this.renderInvoices();
    Utils.toast(`Marked as ${newStatus}`);
  }

  printInvoice(id) {
    const inv = this.store.byId('invoices', id);
    const cust = this.store.byId('customers', inv.customerId);
    const s = this.store.db.settings;
    const lines = inv.lines || [];
    const totalNum = parseFloat(inv.total) || 0;
    const words = Utils.numberToWords(Math.round(totalNum));
    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html>
      <html>
      <head><title>Invoice ${inv.invNum}</title>
      <style>
        body { font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 15mm; background: white; color: black; }
        .invoice-container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .logo-area { display: flex; gap: 15px; align-items: center; }
        .logo-area img { max-height: 70px; max-width: 150px; object-fit: contain; }
        .company-details { text-align: right; }
        .company-name { font-size: 22px; font-weight: 700; color: #0b6b3a; margin: 0; }
        .tagline { font-size: 12px; color: #555; }
        .address { font-size: 11px; margin: 4px 0; }
        .invoice-title { text-align: center; font-size: 18px; font-weight: bold; margin: 15px 0; text-decoration: underline; }
        .info-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 13px; }
        .info-row strong { width: 120px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 12px; }
        th { background: #f5f5f5; }
        .total-row { font-weight: bold; background: #f9f9f9; }
        .words { margin: 15px 0; font-size: 12px; }
        .signatures { display: flex; justify-content: space-between; margin-top: 40px; font-size: 11px; }
        hr { margin: 10px 0; }
        @media print { body { margin: 0; padding: 10mm; } }
      </style>
      </head>
      <body>
      <div class="invoice-container">
        <div class="header">
          <div class="logo-area">
            ${s.companyLogo ? `<img src="${s.companyLogo}" alt="Company Logo">` : '<h2 style="color:#0b6b3a;">PEST CONTROL TECHNICS</h2>'}
            ${s.memberLogo ? `<img src="${s.memberLogo}" alt="Member Logo">` : ''}
          </div>
          <div class="company-details">
            <div class="company-name">${s.companyName || 'PEST CONTROL TECHNICS'}</div>
            <div class="tagline">${s.companyTagline || 'Creating a Pest free environment since 1989'}</div>
            <div class="address">${s.companyAddress || '3-4-607, 1st Floor, NARAYANGUDA, Hyderabad-29'}</div>
            <div class="address">Email: ${s.companyEmail || 'info@pesttech.in'}</div>
          </div>
        </div>
        <div class="invoice-title">TAX INVOICE</div>
        <div class="info-row"><strong>To M/s:</strong> ${cust?.name || ''}</div>
        <div class="info-row"><strong>Invoice No:</strong> ${inv.invNum}</div>
        <div class="info-row"><strong>Date:</strong> ${inv.date}</div>
        <div class="info-row"><strong>Work Order No:</strong> ${inv.workOrderNo || '—'}</div>
        <div class="info-row"><strong>Description:</strong> ${inv.serviceDescription || 'General pest control & rodent control treatment'}</div>
        <table>
          <thead><tr><th>Description of Service</th><th style="text-align:right">Amount (₹)</th></tr></thead>
          <tbody>${lines.map(l => `<tr><td>${l.service}</td><td style="text-align:right">${Number(l.amount).toFixed(2)}</td></tr>`).join('')}
          <tr class="total-row"><td style="text-align:right"><strong>Total</strong></td><td style="text-align:right"><strong>₹${totalNum.toFixed(2)}</strong></td></tr>
          </tbody>
        </table>
        <div class="words"><strong>Rupees:</strong> ${words}</div>
        <div class="signatures">
          <div>Prepared by<br><br><br>_________________</div>
          <div>Checked by<br><br><br>_________________</div>
          <div>Manager<br><br><br>_________________</div>
        </div>
        <hr><p style="font-size:10px; text-align:center;">Thank you for your business</p>
      </div>
      <script>window.onload = function() { window.print(); window.close(); }<\/script>
      </body>
      </html>
    `);
    win.document.close();
  }

  emailInvoice(id) {
    const inv = this.store.byId('invoices', id);
    const cust = this.store.byId('customers', inv.customerId);
    if(!cust?.email) { Utils.toast('Customer has no email address', 'danger'); return; }
    window.location.href = `mailto:${cust.email}?subject=Invoice ${inv.invNum}&body=Dear ${cust.name},%0D%0AInvoice ${inv.invNum} amount ₹${inv.total} is due.%0D%0ARegards`;
  }

  deleteInvoice(id) {
    if(confirm('Delete invoice?')) { this.store.delete('invoices', id); this.renderInvoices(); Utils.toast('Invoice deleted'); }
  }

  // ----- AMC -----
  renderAmc() {
    const amcs = this.store.get('amc');
    const custs = this.store.get('customers');
    const cols = [
      { key:'customerId', label:'Customer', format:v=>custs.find(c=>c.id===v)?.name || 'Unknown' },
      { key:'contractType', label:'Type' }, { key:'startDate', label:'Start' }, { key:'endDate', label:'End' },
      { key:'endDate', label:'Status', format:v => {
          const d = Utils.daysUntil(v);
          if(d===null) return Utils.badge('Active','ok');
          if(d<0) return Utils.badge(`Expired ${-d}d ago`,'bad');
          if(d<=30) return Utils.badge(`Expires in ${d}d`,'warn');
          return Utils.badge(`${d}d left`,'info');
        } },
      { key:'amount', label:'Amount', format:v=>v?Utils.currency(v):'—' }
    ];
    const actions = (row) => `
      <button class="success sm" onclick="app.renewAmcContract('${row.id}')">Renew</button>
      <button class="sec sm" onclick="app.showAmcForm('${row.id}')">✏️</button>
      <button class="danger sm" onclick="app.deleteAmc('${row.id}')">🗑️</button>
    `;
    document.getElementById('ca').innerHTML = `
      <div class="fb mb3"><div class="sw"><i data-lucide="search"></i><input type="text" id="searchAmc" placeholder="Search..." oninput="app.filterTable('amc')"></div><button onclick="app.showAmcForm()">+ New Contract</button></div>
      <div class="card" style="padding:0;" id="amcTable">${Utils.table(amcs, cols, actions, 'No AMC contracts.')}</div>
    `;
  }

  showAmcForm(id) {
    const a = id ? this.store.byId('amc', id) : {};
    const custs = this.store.get('customers');
    this.openModal(id ? 'Edit AMC' : 'New AMC Contract', `
      <form onsubmit="app.saveAmc(event, '${id||''}')">
        <label>Customer</label><select name="customerId" required>${custs.map(c=>`<option value="${c.id}" ${a.customerId===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
        <div class="fr"><div><label>Contract Type</label><select name="contractType">${this.store.contractTypes.map(t=>`<option ${a.contractType===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Amount (₹)</label><input type="number" name="amount" value="${a.amount||''}"></div></div>
        <div class="fr"><div><label>Start Date</label><input type="date" name="startDate" required value="${a.startDate||new Date().toISOString().slice(0,10)}"></div><div><label>End Date</label><input type="date" name="endDate" required value="${a.endDate||''}"></div></div>
        <label>Warranty Expiry</label><input type="date" name="warrantyExpiry" value="${a.warrantyExpiry||''}">
        <label>Notes</label><textarea name="notes">${a.notes||''}</textarea>
        <button type="submit">Save Contract</button>
      </form>
    `);
  }

  saveAmc(e, id) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    if(id) this.store.update('amc', id, data);
    else this.store.add('amc', data);
    this.closeModal();
    this.renderAmc();
    Utils.toast('AMC saved');
  }

  renewAmcContract(id) {
    const a = this.store.byId('amc', id);
    const newEnd = new Date(new Date(a.endDate).setFullYear(new Date(a.endDate).getFullYear()+1)).toISOString().slice(0,10);
    this.store.update('amc', id, { startDate: a.endDate, endDate: newEnd });
    this.renderAmc();
    Utils.toast('Contract renewed for 1 year');
  }

  deleteAmc(id) {
    if(confirm('Delete AMC contract?')) { this.store.delete('amc', id); this.renderAmc(); Utils.toast('AMC deleted'); }
  }

  // ----- INVENTORY -----
  renderInventory() {
    const items = this.store.get('inventory');
    const cols = [
      { key:'name', label:'Item' }, { key:'qty', label:'Stock', format:(v,r)=>`<span style="color:${Number(v)<=Number(r.minQty||5)?'var(--danger)':'var(--success)'}">${v}</span>` },
      { key:'unit', label:'Unit' }, { key:'minQty', label:'Min Alert' }, { key:'supplier', label:'Supplier' }
    ];
    const actions = (row) => `
      <button class="success sm" onclick="app.adjustStock('${row.id}',1)">+</button>
      <button class="warn sm" onclick="app.adjustStock('${row.id}',-1)">−</button>
      <button class="sec sm" onclick="app.showInventoryForm('${row.id}')">✏️</button>
      <button class="danger sm" onclick="app.deleteInventoryItem('${row.id}')">🗑️</button>
    `;
    const lowStock = items.filter(i => Number(i.qty) <= Number(i.minQty||5));
    document.getElementById('ca').innerHTML = `
      ${lowStock.length ? `<div class="card mb3" style="border-left:4px solid var(--danger);background:rgba(239,68,68,.05);"><strong>⚠️ Low stock:</strong> ${lowStock.map(i=>`${i.name} (${i.qty} ${i.unit})`).join(', ')}</div>` : ''}
      <div class="fb mb3"><div class="sw"><i data-lucide="search"></i><input type="text" id="searchInventory" placeholder="Search..." oninput="app.filterTable('inventory')"></div><button onclick="app.showInventoryForm()">+ Add Item</button></div>
      <div class="card" style="padding:0;" id="inventoryTable">${Utils.table(items, cols, actions, 'No inventory items.')}</div>
    `;
  }

  showInventoryForm(id) {
    const it = id ? this.store.byId('inventory', id) : {};
    this.openModal(id ? 'Edit Item' : 'Add Inventory Item', `
      <form onsubmit="app.saveInventoryItem(event, '${id||''}')">
        <div class="fr"><div><label>Name *</label><input name="name" required value="${it.name||''}"></div><div><label>Supplier</label><input name="supplier" value="${it.supplier||''}"></div></div>
        <div class="fr"><div><label>Quantity</label><input type="number" name="qty" min="0" required value="${it.qty||0}"></div><div><label>Unit</label><select name="unit">${['Litres','ml','kg','g','Pieces','Bottles'].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
        <div class="fr"><div><label>Min Stock Alert</label><input type="number" name="minQty" value="${it.minQty||5}"></div><div><label>Unit Cost (₹)</label><input type="number" name="cost" step="1" value="${it.cost||''}"></div></div>
        <label>Notes</label><input name="notes" value="${it.notes||''}">
        <button type="submit">Save</button>
      </form>
    `);
  }

  saveInventoryItem(e, id) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    if(id) this.store.update('inventory', id, data);
    else this.store.add('inventory', data);
    this.closeModal();
    this.renderInventory();
    Utils.toast('Inventory saved');
  }

  adjustStock(id, delta) {
    const item = this.store.byId('inventory', id);
    const newQty = Math.max(0, Number(item.qty) + delta);
    this.store.update('inventory', id, { qty: newQty });
    this.renderInventory();
    if(newQty <= Number(item.minQty||5)) Utils.toast(`Low stock: ${item.name} (${newQty} ${item.unit})`, 'warning');
  }

  deleteInventoryItem(id) {
    if(confirm('Delete this item?')) { this.store.delete('inventory', id); this.renderInventory(); Utils.toast('Item deleted'); }
  }

  // ----- REPORTS -----
  renderReports() {
    const invs = this.store.get('invoices');
    const jobs = this.store.get('jobs');
    const custs = this.store.get('customers');
    const now = new Date();
    const thisMonthRev = invs.filter(i => { const d=new Date(i.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }).reduce((s,i)=>s+Number(i.total||0),0);
    const areaCount = {};
    custs.forEach(c => { if(c.area) areaCount[c.area] = (areaCount[c.area]||0)+1; });
    const serviceCount = {};
    jobs.forEach(j => serviceCount[j.service] = (serviceCount[j.service]||0)+1);
    document.getElementById('ca').innerHTML = `
      <div class="g g4 mb4"><div class="card kc"><div class="kt">This Month Revenue</div><div class="kv">${Utils.currency(thisMonthRev)}</div></div><div class="card kc"><div class="kt">Total Customers</div><div class="kv">${custs.length}</div></div><div class="card kc"><div class="kt">Total Jobs</div><div class="kv">${jobs.length}</div></div><div class="card kc"><div class="kt">Invoices</div><div class="kv">${invs.length}</div></div></div>
      <div class="g g2"><div class="card"><h4>📊 Customers by Area</h4>${Object.entries(areaCount).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="sr"><span>${a}</span><strong>${n}</strong></div>`).join('')||'<p class="muted">No area data.</p>'}</div>
      <div class="card"><h4>🔧 Jobs by Service</h4>${Object.entries(serviceCount).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="sr"><span>${s}</span><strong>${n}</strong></div>`).join('')||'<p class="muted">No jobs yet.</p>'}</div></div>
      <div class="card"><h4>📎 Export Data</h4><div class="fb"><button onclick="app.exportCSV('customers')">Customers CSV</button><button onclick="app.exportCSV('invoices')">Invoices CSV</button><button onclick="app.exportCSV('jobs')">Jobs CSV</button><button onclick="app.exportCSV('amc')">AMC CSV</button><button onclick="app.exportCSV('inventory')">Inventory CSV</button></div></div>
    `;
  }

  exportCSV(table) {
    const data = this.store.get(table);
    if(!data.length) { Utils.toast('No data to export','danger'); return; }
    const keys = Object.keys(data[0]).filter(k => typeof data[0][k] !== 'object');
    let csv = keys.join(',') + '\n';
    data.forEach(row => { csv += keys.map(k => `"${(row[k]||'').toString().replace(/"/g,'""')}"`).join(',') + '\n'; });
    const blob = new Blob([csv], {type:'text/csv'});
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `pct_${table}_${new Date().toISOString().slice(0,10)}.csv`;
    link.click(); URL.revokeObjectURL(link.href);
    Utils.toast(`${table} exported`);
  }

  // ----- SETTINGS -----
  renderSettings() {
    const s = this.store.db.settings;
    const users = this.store.get('users');
    const logs = this.store.get('logs');
    document.getElementById('ca').innerHTML = `
      <div class="g g2 mb4">
        <div class="card"><h4>Company Details</h4><form onsubmit="app.saveCompanySettings(event)"><input name="companyName" placeholder="Company Name" value="${s.companyName||''}"><input name="companyTagline" placeholder="Tagline" value="${s.companyTagline||''}"><textarea name="companyAddress" rows="2" placeholder="Address">${s.companyAddress||''}</textarea><input name="companyEmail" placeholder="Email" value="${s.companyEmail||''}"><div class="fr"><input name="companyPhone" placeholder="Phone" value="${s.companyPhone||''}"><input name="companyGST" placeholder="GSTIN" value="${s.companyGST||''}"></div><button type="submit">Save Settings</button></form></div>
        <div class="card"><h4>Logos & Backup</h4>
          <label>Company Logo</label><input type="file" accept="image/*" onchange="app.uploadLogo(event, 'companyLogo')">${s.companyLogo ? `<img src="${s.companyLogo}" style="max-height:50px; margin-top:5px; border:1px solid var(--border); border-radius:4px;">` : ''}
          <label style="margin-top:12px;">Member Logo (IPCA / Association)</label><input type="file" accept="image/*" onchange="app.uploadLogo(event, 'memberLogo')">${s.memberLogo ? `<img src="${s.memberLogo}" style="max-height:50px; margin-top:5px; border:1px solid var(--border); border-radius:4px;">` : ''}
          <div style="margin-top:15px;"><button class="sec" onclick="app.backupData()">📥 Download Backup</button><button class="sec" style="margin-left:8px;" onclick="document.getElementById('restoreFile').click()">📤 Restore Backup</button><input type="file" id="restoreFile" style="display:none" accept=".json" onchange="app.restoreData(event)"></div>
        </div>
      </div>
      <div class="card mb4"><h4>User Accounts</h4>${Utils.table(users, [{key:'username',label:'Username'},{key:'role',label:'Role',format:v=>Utils.badge(v, v==='admin'?'ok':'info')}], row => this.me.id !== row.id ? `<button class="danger sm" onclick="app.deleteUser('${row.id}')">Delete</button>` : '<span>You</span>')}<button class="sec mt3" onclick="app.showAddUserForm()">+ Add User</button></div>
      <div class="card"><h4>Audit Log</h4><div style="max-height:300px;overflow-y:auto;">${Utils.table(logs.slice(0,100), [{key:'time',label:'Time'},{key:'user',label:'User'},{key:'action',label:'Action'}], null)}</div></div>
    `;
  }

  uploadLogo(e, key) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => { this.store.db.settings[key] = ev.target.result; this.store.save(); Utils.toast('Logo saved'); this.renderSettings(); };
    reader.readAsDataURL(file);
  }

  saveCompanySettings(e) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    Object.assign(this.store.db.settings, data);
    this.store.save();
    Utils.toast('Settings saved');
  }

  backupData() {
    const data = JSON.stringify(this.store.db);
    const blob = new Blob([data], {type:'application/json'});
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `pct_backup_${new Date().toISOString().slice(0,10)}.json`;
    link.click(); URL.revokeObjectURL(link.href);
    Utils.toast('Backup downloaded');
  }

  restoreData(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if(imported.users && imported.customers) {
          this.store.db = imported;
          this.store.save();
          Utils.toast('Restore successful. Reloading...');
          setTimeout(() => location.reload(), 1500);
        } else throw new Error();
      } catch(err) { Utils.toast('Invalid backup file', 'danger'); }
    };
    reader.readAsText(file);
  }

  showAddUserForm() {
    this.openModal('Add User', `
      <form onsubmit="app.saveNewUser(event)">
        <label>Username</label><input name="username" required>
        <label>Password</label><input type="password" name="pass" required>
        <label>Role</label><select name="role"><option>technician</option><option>manager</option><option>admin</option></select>
        <button type="submit">Add User</button>
      </form>
    `);
  }

  saveNewUser(e) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    if(this.store.get('users').find(u => u.username === data.username)) { Utils.toast('Username exists','danger'); return; }
    this.store.add('users', data);
    this.closeModal();
    this.renderSettings();
    Utils.toast('User added');
  }

  deleteUser(id) {
    if(confirm('Delete this user?')) { this.store.delete('users', id); this.renderSettings(); Utils.toast('User deleted'); }
  }
}
